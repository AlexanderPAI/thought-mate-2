llm_config:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  model: your-model
  temperature: 0.7
  max_tokens: 1000
  stream: false
  embedding_model: embedding_model
  top_k: 5

log_level: info
agent_max_steps: 10

workspaces:
  tmp: ./tmp

knowledge:
  qdrant_url: http://qdrant:6333
  collection_alias: knowledge
  sources:
    - /knowledge
